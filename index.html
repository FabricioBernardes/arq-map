<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA=" crossorigin=""/>
    <title>ARQ-MAP</title>
</head>
<body>
    <header id="app-header">
        <div class="app-header-left">
            <button id="sidebar-toggle" type="button" aria-label="Mostrar/ocultar lista de sítios" aria-expanded="false" aria-controls="sidebar">☰ Sítios</button>
            <span id="app-logo">ArqMap</span>
        </div>
        <button id="options-toggle" type="button" aria-haspopup="dialog" aria-controls="options-modal">⚙ Opções</button>
    </header>
    <div class="page-wrapper">
        <aside id="sidebar">
            <div class="sidebar-header">
                <p id="result-count"></p>
            </div>
            <button id="download-filtered" type="button" class="download-btn">⬇ Baixar sítios filtrados (GeoJSON)</button>
            <input type="search" id="site-search" placeholder="Buscar por nome..." aria-label="Buscar sítio por nome">
            <details id="type-filters-details" class="sidebar-section" open>
                <summary>Filtrar por tipo</summary>
                <fieldset id="type-filters"></fieldset>
            </details>
            <details id="source-filters-details" class="sidebar-section">
                <summary>Filtrar por fonte bibliográfica</summary>
                <fieldset id="source-filters"></fieldset>
            </details>
            <details id="site-list-details" class="sidebar-section" open>
                <summary>Sítios</summary>
                <ul id="site-list"></ul>
            </details>
        </aside>
        <div id="map"></div>
        <aside id="site-panel" aria-hidden="true" aria-label="Detalhes do sítio">
            <button id="site-panel-close" type="button" aria-label="Fechar detalhes do sítio">✕</button>
            <button id="site-panel-download" type="button" class="download-btn">⬇ Baixar GeoJSON deste sítio</button>
            <div id="site-panel-content"></div>
        </aside>
    </div>
    <div id="options-modal-backdrop"></div>
    <div id="options-modal" role="dialog" aria-modal="true" aria-labelledby="options-modal-title" aria-hidden="true">
        <div class="options-modal-header">
            <h2 id="options-modal-title">Opções</h2>
            <button id="options-modal-close" type="button" aria-label="Fechar opções">✕</button>
        </div>
        <div class="options-modal-body">
            <section class="options-section">
                <h3>Visualização</h3>
                <label class="options-toggle-row">
                    <input type="checkbox" id="clustering-toggle" checked>
                    Agrupar pontos próximos conforme o zoom
                </label>
            </section>
            <section class="options-section">
                <h3>Dados</h3>
                <p class="options-note">As coordenadas (latitude/longitude, em graus decimais) são exibidas e exportadas exatamente como constam na base de dados original, sem qualquer conversão ou reprojeção.</p>
                <button id="download-all" type="button" class="download-btn">⬇ Baixar toda a base de dados (GeoJSON)</button>
            </section>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
    <script src="./data.js"></script>
    <script src="./export.js"></script>
    <script src="./index.js"></script>
</body>
</html>
